"ta-IN":
  label_cma_dates: "தேதிகள்"
  label_cma_menu_position: "சூழல் பட்டியலில் நிலை"
  label_cma_mixed_values: "(வெவ்வேறு மதிப்புகள்)"
  label_cma_position_bottom: "கீழே"
  label_cma_position_top: "மேலே"
  text_cma_request_unknown: "கோரிக்கை முடிவடையவில்லை, சில மாற்றங்கள் ஏற்கனவே சேமிக்கப்பட்டிருக்கலாம். மீண்டும் சமர்ப்பிப்பது பாதுகாப்பானது: எதுவும் இருமுறை செயல்படுத்தப்படாது."
  text_cma_todo_lists_dates_conflict: "Issue To-do Lists %{version} சூழல் பட்டியலில் தேதிகளையும் சேர்க்கிறது, அதனால் அது இருமுறை தோன்றும். அந்த நீட்சியின் அமைப்புகளில் அதை அணைக்கவும், அல்லது %{fixed} அல்லது அதற்குப் பிந்தைய பதிப்பிற்கு மேம்படுத்தவும்."
